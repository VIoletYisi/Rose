name: Build Rose for Windows

on:
  workflow_dispatch:

  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "Rose.spec"
      - "scripts/**"
      - "vendor/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure Party relay
        shell: pwsh
        env:
          ROSE_RELAY_URL: ${{ secrets.ROSE_RELAY_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ROSE_RELAY_URL)) {
              throw "ROSE_RELAY_URL secret is not configured."
          }

          python -c "import os; from pathlib import Path; u=os.environ['ROSE_RELAY_URL'].strip(); assert u.startswith('wss://'); Path('party/network/relay_config.py').write_text('RELAY_URL = ' + repr(u) + '\n', encoding='utf-8')"

      - name: Verify Party relay configuration
        shell: pwsh
        run: |
          python -c "from party.network.ws_relay import RELAY_URL; assert RELAY_URL.startswith('wss://'); print('Party relay configuration embedded successfully.')"

      - name: Build Rose
        shell: pwsh
        run: |
          python scripts/build_pyinstaller.py

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Rose\Rose.exe")) {
              throw "Build failed: dist\Rose\Rose.exe was not generated."
          }

          Write-Host "Rose.exe generated successfully."
          Get-ChildItem "dist\Rose"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Windows
          path: dist/Rose/
          if-no-files-found: error
          retention-days: 14
