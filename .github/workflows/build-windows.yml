name: Build Rose for Windows

on:
  workflow_dispatch:

  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "Rose.spec"
      - "scripts/**"
      - "vendor/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Rose
        shell: pwsh
        run: |
          python scripts/build_pyinstaller.py

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Rose\Rose.exe")) {
              throw "Build failed: dist\Rose\Rose.exe was not generated."
          }

          Write-Host "Rose.exe generated successfully."
          Get-ChildItem "dist\Rose"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Windows
          path: dist/Rose/
          if-no-files-found: error
          retention-days: 14
